<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ángel Serrano Domínguez · Desarrollador de aplicaciones</title>

    <meta name="author" content="Ángel Serrano Domínguez" />
    <meta
      name="description"
      content="Portfolio de Ángel Serrano Domínguez. Aplicaciones Android, Flutter y web construidas de principio a fin, con demos interactivas y las decisiones técnicas de cada una."
    />
    <meta name="theme-color" content="#EAE6DD" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Open Graph: lo que se ve al pegar el enlace en LinkedIn, WhatsApp o X.
      El marcador SITE_URL entre signos de porcentaje lo sustituye Vite al compilar por SITE_URL de
      src/data/profile.js (ver vite.config.js). Para cambiar de dominio
      basta con tocar esa constante.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ángel Serrano Domínguez" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta
      property="og:title"
      content="Ángel Serrano Domínguez · Desarrollador de aplicaciones multiplataforma"
    />
    <meta
      property="og:description"
      content="Ocho aplicaciones Android, Flutter y web construidas de principio a fin. Cada una con demo interactiva y las decisiones técnicas explicadas."
    />
    <meta
      property="og:image"
      content="%SITE_URL%/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ángel Serrano Domínguez, desarrollador de aplicaciones multiplataforma"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ángel Serrano Domínguez · Desarrollador de aplicaciones multiplataforma"
    />
    <meta
      name="twitter:description"
      content="Ocho aplicaciones Android, Flutter y web construidas de principio a fin, con demos interactivas."
    />
    <meta
      name="twitter:image"
      content="%SITE_URL%/og-image.png"
    />

    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Ranade (Fontshare). La variable cubre de 100 a 700 en un solo archivo. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=ranade@1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
